services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waterly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waterly}
      POSTGRES_DB: ${POSTGRES_DB:-waterly_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      target: migrator
    environment: &app-env
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-waterly_dev};Username=${POSTGRES_USER:-waterly};Password=${POSTGRES_PASSWORD:-waterly}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env (at least 32 bytes)}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${API_PORT:-5290}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
